<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish & Camp - 실시간 예약</title>
    <link rel="stylesheet" href="css/css.css">
    </head>
<body>
    <div class="wrapper">
        <header class="header">
            <div class="container header-content">
                <div class="logo">
                    <span class="logo-icon">⛺</span>
                    <span class="logo-text">Fish<span class="blue">&</span>Camp</span>
                </div>
                <nav class="nav">
                    <a href="#" class="active">실시간 예약</a>
                    <a href="#">이용 안내</a>
                    <a href="#">커뮤니티</a>
                </nav>
                <div class="header-right">
                    <button class="home-btn">🏠</button>
                </div>
            </div>
        </header>

        <main class="container main-content">
            <div class="grid-layout">
                <section class="section-calendar">
                    <div class="section-header">
                        <h2>날짜 선택</h2>
                        <p>원하시는 체크인 날짜를 선택해주세요.</p>
                    </div>
                    
<input type="text" id="selectedDate" readonly />
                    <div class="calendar-card">
                        <div class="calendar-nav">
                            <span class="calendar-title">2025년 12월</span>
                            <div class="nav-btns">
                                <button>&lt;</button>
                                <button>&gt;</button>
                            </div>
                        </div>
                        <div class="calendar-grid">
                            <div class="day-label red">일</div>
                            <div class="day-label">월</div>
                            <div class="day-label">화</div>
                            <div class="day-label">수</div>
                            <div class="day-label">목</div>
                            <div class="day-label">금</div>
                            <div class="day-label">토</div>

<script>
  const dateCells = document.querySelectorAll('.calendar-grid .date');
  const inputBox = document.getElementById('selectedDate');

  dateCells.forEach(cell => {
    cell.addEventListener('click', () => {
      if (!cell.classList.contains('empty')) {
        // 현재 표시된 년/월 가져오기
        const yearMonth = document.querySelector('.calendar-title').textContent;
        const day = cell.textContent.trim();
        inputBox.value = `${yearMonth} ${day}일`;
      }
    });
  });
</script>
                            
<script>
  let currentDate = new Date(2025, 11); // 2025년 12월 (month는 0부터 시작)

  const title = document.querySelector('.calendar-title');
  const grid = document.querySelector('.calendar-grid');

  function renderCalendar(date) {
    const year = date.getFullYear();
    const month = date.getMonth();

    // 제목 업데이트
    title.textContent = `${year}년 ${month+1}월`;

    // 기존 날짜 지우기
    grid.innerHTML = `
      <div class="day-label red">일</div>
      <div class="day-label">월</div>
      <div class="day-label">화</div>
      <div class="day-label">수</div>
      <div class="day-label">목</div>
      <div class="day-label">금</div>
      <div class="day-label">토</div>
    `;

    // 이번 달 1일의 요일
    const firstDay = new Date(year, month, 1).getDay();
    // 이번 달 마지막 날짜
    const lastDate = new Date(year, month+1, 0).getDate();

    // 빈칸 채우기
    for (let i=0; i<firstDay; i++) {
      grid.innerHTML += `<div class="date empty"></div>`;
    }

    // 날짜 채우기
    for (let d=1; d<=lastDate; d++) {
      const isSunday = ( (firstDay + d -1) % 7 === 0 );
      grid.innerHTML += `<div class="date ${isSunday ? 'red' : ''}">${d}</div>`;
    }
  }

  // 초기 렌더
  renderCalendar(currentDate);

  // 버튼 이벤트
  document.querySelector('.nav-btns button:first-child').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth()-1);
    renderCalendar(currentDate);
  });
  document.querySelector('.nav-btns button:last-child').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth()+1);
    renderCalendar(currentDate);
  });
</script>


<script>

  grid.addEventListener('click', (e) => {
    const cell = e.target.closest('.date');
    if (cell && !cell.classList.contains('empty')) {
      // 기존 선택 제거
      document.querySelectorAll('.calendar-grid .date.selected')
              .forEach(el => el.classList.remove('selected'));

      // 새 선택 적용
      cell.classList.add('selected');

      // 날짜 값 저장
      const yearMonth = document.querySelector('.calendar-title').textContent;
      const [year, month] = yearMonth.replace('년','').replace('월','').trim().split(' ');
      const day = cell.textContent.trim();
      inputBox.value = `${year}/${month}/${day}`;
    }
  });
</script>




                        </div>
                    </div>
                </section>

                <section class="section-map">
                    <div class="section-header">
                        <h2>구역 배치도</h2>
                        <p>캠핑장 전체 배치도를 확인하세요.</p>
                    </div>
                    <div class="map-container">
                        <div class="map-placeholder" style="background-image:url('images/예약좌대.png'); background-size:cover; background-position:center;">
                        </div>
                    </div>
                </section>
            </div>
        </main>
        

        <div class="floating-bar">
            <div class="bar-info">
                <div class="info-group">
                    <label>CHECK-IN</label>
                    <span class="value">선택안함</span>
                </div>
                <div class="divider"></div>
                <div class="info-group">
                    <label>SELECTED SITE</label>
                    <span class="value">선택안함</span>
                </div>
            </div>
            <button class="reserve-btn" disabled>예약하기</button>
        </div>
    </div>
</body>
</html>
